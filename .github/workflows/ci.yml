name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'

  hook-integrity:
    name: Supply-chain hook integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verify the wrappers, hooks, and their tests have not been mutated.
      # If this fails, regenerate .security/hook-hashes.sha256 with:
      #   sha256sum .claude/hooks/check-uv-install.sh \
      #             .claude/hooks/check-protected-files.sh \
      #             scripts/uv-install.sh \
      #             scripts/install-npm-pinned.sh \
      #             scripts/test/test-claude-hooks.sh \
      #             scripts/test/test-uv-install.sh \
      #     > .security/hook-hashes.sha256
      # and request a code-owner review on the PR.
      - run: sha256sum -c .security/hook-hashes.sha256

  wrapper-tests:
    name: Supply-chain wrapper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned to v3.2.4 for supply-chain safety.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          version: "0.7.19"
      - run: bash scripts/test/test-uv-install.sh

  hook-tests:
    name: Claude Code hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test/test-claude-hooks.sh

  lockfile-cooldown:
    name: Lockfile cooldown guard
    runs-on: ubuntu-latest
    # Mirrors the Dockerfile guard at apps/api/Dockerfile:30 so a PR that
    # regenerates apps/api/uv.lock without going through `make api-lock`
    # (which injects --exclude-newer via scripts/uv-install.sh) is caught
    # on develop instead of failing the Cloud Run deploy on merge to main.
    steps:
      - uses: actions/checkout@v4
      - name: Verify apps/api/uv.lock has exclude-newer cooldown
        run: |
          if ! grep -q '^exclude-newer = ' apps/api/uv.lock; then
            echo "ERROR: apps/api/uv.lock is missing [options] exclude-newer." >&2
            echo "       Regenerate the lockfile with 'make api-lock' so the" >&2
            echo "       supply-chain release-age cooldown is recorded." >&2
            exit 1
          fi
          echo "OK: $(grep '^exclude-newer = ' apps/api/uv.lock)"

  lint-api:
    name: Lint API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # SHA-pinned to v3.2.4 for supply-chain safety. Refresh with the SHA from
      # https://github.com/astral-sh/setup-uv/releases when bumping the version.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          version: "0.7.19"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check src/

  lint-mobile:
    name: Lint Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # npm >= 11.10 is required for the `min-release-age` cooldown set in
      # apps/mobile/.npmrc. Use the shared integrity-verified installer so a
      # compromised registry cannot serve a backdoored npm that disables the
      # cooldown before `npm ci` reads .npmrc.
      - name: Install pinned npm (integrity-verified)
        run: ../../scripts/install-npm-pinned.sh
      - run: npm ci
      - run: npx eslint src/

  test-api:
    name: Test API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: "sqlite+aiosqlite:///"
      REDIS_URL: "redis://localhost:6379"
      OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
      ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # SHA-pinned to v3.2.4 for supply-chain safety. Refresh with the SHA from
      # https://github.com/astral-sh/setup-uv/releases when bumping the version.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          version: "0.7.19"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest --tb=short

  test-mobile:
    name: Test Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # npm >= 11.10 is required for the `min-release-age` cooldown set in
      # apps/mobile/.npmrc. Use the shared integrity-verified installer so a
      # compromised registry cannot serve a backdoored npm that disables the
      # cooldown before `npm ci` reads .npmrc.
      - name: Install pinned npm (integrity-verified)
        run: ../../scripts/install-npm-pinned.sh
      - run: npm ci
      - run: npx jest --ci --coverage
