name: Refresh uv.lock cooldown

# Supply-chain trade-off: apps/api/uv.lock freezes `exclude-newer` at lock
# time, so any Python package released after the cutoff is invisible until
# someone runs `make api-lock`. That is the intended cooldown, but it also
# means a long period of inactivity will freeze out legitimate security
# patches. This workflow runs weekly, regenerates the lockfile with the
# cooldown advanced to "now - 7 days", and opens a PR if anything changed.
#
# A human still has to review and merge the PR, so no automated dependency
# lands without oversight.

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate uv.lock and open PR on change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SHA-pinned to v3.2.4 for supply-chain safety.
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          version: "0.7.19"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Regenerate lockfile via wrapper (applies 7-day cooldown)
        run: make api-lock

      - name: Detect lockfile changes
        id: diff
        run: |
          if git diff --quiet apps/api/uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show diff summary
        if: steps.diff.outputs.changed == 'true'
        run: git diff --stat apps/api/uv.lock

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/uv-lock-refresh
          base: develop
          commit-message: "chore: refresh apps/api/uv.lock (weekly cooldown advance)"
          title: "chore: refresh apps/api/uv.lock (weekly cooldown advance)"
          body: |
            Automated weekly refresh of `apps/api/uv.lock`.

            The lockfile's `exclude-newer` marker was advanced by
            re-running `make api-lock` (which uses `scripts/uv-install.sh`
            with the 7-day cooldown). Any dependency whose newest
            cooldown-clean version changed is reflected in the diff.

            **Review checklist**:
            - [ ] No unexpected major version jumps
            - [ ] No new dependencies introduced
            - [ ] CI green (the usual test suite will run against the new lockfile)

            Generated by `.github/workflows/uv-lock-refresh.yml`.
          labels: |
            supply-chain
            automated
