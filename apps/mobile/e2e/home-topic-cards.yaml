# home-topic-cards.yaml
# Verifies all 5 topic cards are visible on the Home screen and the
# history button is accessible. Does NOT tap any cards.
#
# Expected result: All topic cards and the history button are rendered.
# Note: Uses testID-based selectors (`id`) because Maestro's text matching
# cannot reliably find text inside FlatList items on iOS.
appId: to.coyo.app
---
# Launch the application (clearState: false to preserve expo-dev-client settings)
- launchApp:
    clearState: false

# Ensure signed in (handles unauthenticated state when running flow individually)
- runFlow:
    file: helpers/ensure-signed-in.yaml

# Wait for the Home screen to fully render.
# On Android emulators, the Expo dev client cold start can be slow.
- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 30000

# Scroll to each topic card. With personalized + trending suggestions
# now reliably populated above the fold, the fixed topic cards are pushed
# further down — sometimes the entire viewport. A fixed-distance swipe is
# brittle here, so we use scrollUntilVisible to walk through every card
# regardless of how tall the suggestions section happens to be.
- scrollUntilVisible:
    element:
      id: "topic-sports"
    direction: DOWN
    speed: 40
- scrollUntilVisible:
    element:
      id: "topic-business"
    direction: DOWN
    speed: 40
- scrollUntilVisible:
    element:
      id: "topic-politics"
    direction: DOWN
    speed: 40
- scrollUntilVisible:
    element:
      id: "topic-technology"
    direction: DOWN
    speed: 40
- scrollUntilVisible:
    element:
      id: "topic-entertainment"
    direction: DOWN
    speed: 40

# Capture evidence of all topic cards
- takeScreenshot: "home-topic-cards-all"

# Scroll back to the top of the screen to verify the TOPICS section label
# and the history button are both accessible from the header. The previous
# scrollUntilVisible steps walked the user all the way down to the
# entertainment card, pushing the fixed-position header (history button)
# and the TOPICS section label out of the viewport.
- scrollUntilVisible:
    element:
      id: "history-button"
    direction: UP
    speed: 40
- assertVisible:
    id: "history-button"
- assertVisible: "TOPICS"
