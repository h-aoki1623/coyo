# sign-out.yaml
# Helper flow: signs out the current user from the Home screen.
#
# Prerequisites:
# - The app must be on the Home screen (authenticated)
# - The sign-out button (testID: sign-out-button) must be visible
#
# This file is NOT listed in config.yaml and is NOT a test flow.
appId: to.coyo.app
---
# Tap the sign-out button on the Home screen
- tapOn:
    id: "sign-out-button"

# Wait for the confirmation Alert to finish animating in before the
# conditional runFlow blocks below evaluate their visibility predicates
# — without this, the first `when: visible` can short-circuit against a
# half-rendered Alert and silently skip all three branches.
- waitForAnimationToEnd

# Confirm sign-out in the native Alert.
# On Android, native AlertDialog auto-uppercases ("SIGN OUT" — unique on screen).
# On iOS, the button is "Sign Out" (same label as the trigger button, so use index: 1).
- runFlow:
    when:
      visible: "SIGN OUT"
    commands:
      - tapOn: "SIGN OUT"
- runFlow:
    when:
      visible:
        text: "Sign Out"
        index: 1
    commands:
      - tapOn:
          text: "Sign Out"
          index: 1
- runFlow:
    when:
      visible:
        text: "サインアウト"
        index: 1
    commands:
      - tapOn:
          text: "サインアウト"
          index: 1

# Wait for the Welcome screen to appear after sign-out
- extendedWaitUntil:
    visible:
      id: "welcome-get-started"
    timeout: 15000
