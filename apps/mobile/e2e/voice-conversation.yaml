# voice-conversation.yaml
# Verifies a 4-turn voice conversation flow with correction verification.
# In E2E mode, the microphone is bypassed and pre-recorded test audio files
# are sent to the backend instead of live recording.
#
# Turn sequence:
#   Turn 1 (user): clean audio  → correction result = no corrections
#   Turn 2 (AI):   AI response
#   Turn 3 (user): error audio  → correction result = has corrections (multiple)
#   Turn 4 (AI):   AI response
#
# PREREQUISITES:
# - App must be built with E2E_MODE=true
# - Backend API must be running and reachable
# - e2e/fixtures/test-audio-clean.m4a must exist (bundled at build time)
# - e2e/fixtures/test-audio-errors.m4a must exist (bundled at build time)
appId: to.coyo.app
---
# -- Step 1: Launch and navigate to Talk screen --

- launchApp:
    clearState: false

# Ensure signed in (handles unauthenticated state when running flow individually)
- runFlow:
    file: helpers/ensure-signed-in.yaml

- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 30000

# Scroll to the Sports topic card. With suggestions populated above the
# fold (see suggestions-store.ts), Sports is pushed further down. The
# previous `scrollUntilVisible` raced the suggestions render: when the
# trending section landed mid-scroll the element coordinates Maestro
# resolved for `topic-sports` no longer matched its post-layout position,
# and the tap landed on the sign-out button at the screen bottom (issue
# #157). `waitForAnimationToEnd` after the scroll lets layout settle
# before the tap is dispatched.
- scrollUntilVisible:
    element:
      id: "topic-sports"
    direction: DOWN
    speed: 40
    # Center the card in the viewport. iOS accessibility reports element
    # bounds in screen coordinates, ignoring ScrollView clipping. Without
    # `centerElement`, Maestro stops scrolling as soon as the card's
    # rectangle intersects the screen — which on a narrow viewport leaves
    # the card visually overlapping the sign-out button at the bottom,
    # and the tap lands on Sign Out instead of Sports (issue #157).
    centerElement: true
- waitForAnimationToEnd

- tapOn:
    id: "topic-sports"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "end-conversation"
    timeout: 15000

- assertVisible:
    id: "end-conversation"

# Wait for AI greeting audio to finish and recording to auto-start.
# After greeting audio playback completes, recording starts automatically.
- extendedWaitUntil:
    visible:
      id: "send-recording"
    timeout: 60000

- takeScreenshot: "voice-01-talk-screen"

# -- Step 2: Turn 1 — Send recording (clean audio, no corrections expected) --
# Recording auto-started after greeting audio finished.

- tapOn:
    id: "send-recording"

# Wait for AI turn audio to finish and recording to auto-start
- extendedWaitUntil:
    visible:
      id: "send-recording"
    timeout: 60000

- takeScreenshot: "voice-02-turn1-complete"

# Verify: no corrections for clean audio
- runFlow:
    when:
      visible:
        id: "correction-clean"
    commands:
      - takeScreenshot: "voice-02b-no-corrections"

# -- Step 3: Turn 3 — Send recording (error audio, corrections expected) --
# Recording auto-started after AI turn audio finished.

- tapOn:
    id: "send-recording"

# Wait for AI turn audio to finish and recording to auto-start
- extendedWaitUntil:
    visible:
      id: "send-recording"
    timeout: 60000

- takeScreenshot: "voice-03-turn3-complete"

# Verify: has corrections for error audio.
# Use runFlow with when:visible to make this conditional — the AI model's
# correction behavior is non-deterministic, so the correction UI may not
# always appear even with intentional grammar errors in the test audio.
- runFlow:
    when:
      visible:
        id: "correction-toggle"
    commands:
      - takeScreenshot: "voice-03b-has-corrections"

      # Tap to expand the correction card
      - tapOn:
          id: "correction-toggle"

      # Wait for the expand animation (300ms) to complete
      - extendedWaitUntil:
          visible:
            id: "correction-card"
          timeout: 10000
      - assertVisible:
          id: "correction-corrected-text"
      - assertVisible:
          id: "correction-explanation"

      - takeScreenshot: "voice-03c-correction-expanded"

      # Tap again to collapse the correction card
      - tapOn:
          id: "correction-toggle"

      # Wait for the collapse animation to finish and card to unmount
      - extendedWaitUntil:
          notVisible:
            id: "correction-card"
          timeout: 5000

      - takeScreenshot: "voice-03d-correction-collapsed"

# -- Step 4: End conversation --

- tapOn:
    id: "end-conversation"

# Confirm the end dialog.
# On Android, native AlertDialog auto-uppercases to "END" (unique on screen).
# On iOS, the button text is "End" (same as the header button, so use index: 1).
- runFlow:
    when:
      visible: "END"
    commands:
      - tapOn: "END"
- runFlow:
    when:
      visible:
        text: "End"
        index: 1
    commands:
      - tapOn:
          text: "End"
          index: 1

# Wait for completion footer
- extendedWaitUntil:
    visible:
      id: "view-feedback"
    timeout: 15000

- takeScreenshot: "voice-04-conversation-ended"

# -- Step 5: Navigate to Feedback --

- tapOn:
    id: "view-feedback"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "go-home"
    timeout: 15000

- takeScreenshot: "voice-05-feedback-screen"

# -- Step 6: Return to Home --

- tapOn:
    id: "go-home"

- waitForAnimationToEnd

# Home preserves the ScrollView's scroll position across navigation (the
# HomeScreen component is kept mounted by the native stack). After the
# Sports card was centered during scrollUntilVisible, the greeting is
# now above the fold — scroll back to the top before asserting.
- scrollUntilVisible:
    element:
      id: "home-greeting"
    direction: UP
    speed: 40
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: "home-greeting"
    timeout: 5000

- takeScreenshot: "voice-06-returned-home"
