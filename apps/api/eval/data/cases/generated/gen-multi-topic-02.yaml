- role: user
  text: Oh my god, yes! There was this tiny yakitori place in Shinjuku... no English
    menu, just locals. The owner was so friendly even though my Japanese is terrible.
    And the tsukemen I had in Shibuya was just... I can't even describe it. Way better
    than anything I've tried back home.
- role: ai
  text: Those hole-in-the-wall places are often the best! It sounds like you really
    immersed yourself in the food culture. Are you already planning your next trip?
- role: user
  text: Actually, yeah! I'm thinking either Vietnam or Peru next. I've heard the street
    food in Hanoi is incredible, but then again, I really want to try authentic ceviche
    in Lima. This is always my problem - too many places, not enough vacation days!
